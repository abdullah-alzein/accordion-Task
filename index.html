<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Common questions</title>
  </head>
  <body>
    <section class="card">
      <h1>common questions</h1>
      <div class="accordion">
        <div class="accordion-item">
          <button class="question" id="q1" type="button" aria-expanded="false" aria-controls="a1">
            How much time does delivery take?
          </button>
          <p class="answer" id="a1" hidden>10 minutes to reply</p>
        </div>
        <div class="accordion-item">
          <button class="question" id="q2" type="button" aria-expanded="false" aria-controls="a2">
            Can I change my order
          </button>
          <p class="answer" id="a2" hidden>yes you can change your order</p>
        </div>
        <div class="accordion-item">
          <button class="question" id="q3" type="button" aria-expanded="false" aria-controls="a3">
            What are the available payment method
          </button>
          <p class="answer" id="a3" hidden>visa card or paypal</p>
        </div>
        <div class="accordion-item">
          <button class="question" id="q4" type="button" aria-expanded="false" aria-controls="a4">
            How to contact support?
          </button>
          <p class="answer" id="a4" hidden>
            you can email on this email
            <a href="mailto:support@gmail.com">support@gmail.com</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
